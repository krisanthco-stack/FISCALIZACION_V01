name: L26 - PWA GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias de pruebas
        run: python -m pip install --upgrade pytest lxml
      - name: Pruebas de regresión
        run: python scripts/run_ci.py
      - name: Incluir motor PDF compatible offline
        run: python scripts/vendor_pdfjs.py --required
      - name: Verificar fuente única
        run: python scripts/distribution_parity.py
      - name: Construir PWA desde runtime canónico
        run: python scripts/build_web_release.py --output dist/web
      - name: Verificar paridad PWA
        run: python scripts/distribution_parity.py --tree dist/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
