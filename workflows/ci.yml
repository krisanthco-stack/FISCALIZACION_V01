name: L26 - Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias de pruebas
        run: python -m pip install --upgrade pytest lxml
      - name: Ejecutar compuerta de regresión
        run: python scripts/run_ci.py
      - name: Verificar fuente única y entrypoints
        run: python scripts/distribution_parity.py
